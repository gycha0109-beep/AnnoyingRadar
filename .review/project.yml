schema_version: "1.0"
project:
  id: annoying-radar
  name: AnnoyingRadar
  type: web-application
  repository_root: "."
  baseline_branch: main
inherits: [nextjs-supabase]
technology:
  languages: [javascript, sql]
  frameworks: [nextjs, supabase]
  database:
    engine: postgresql
scope:
  include:
    - "app/**"
    - "lib/**"
    - "supabase/**"
    - "scripts/**"
    - "tests/**"
    - "docs/**"
    - "package*.json"
    - "next.config.*"
    - "eslint.config.*"
    - ".review/**"
    - ".github/workflows/**"
  exclude:
    - "node_modules/**"
    - ".next/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - ".pie/**"
protected_paths: []
commands:
  build: []
  baseline: []
  integration: []
review:
  packs:
    - universal.architecture
    - universal.requirements-traceability
    - universal.test-completeness
    - application.authentication
    - application.authorization
    - data.rls
    - data.migration-safety
    - data.relational-integrity
    - runtime.retries-idempotency
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: false
    regression_tests: false
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false
