name: Source Threads Carrier Feature Acquisition 15.9AA

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-threads-carrier-feature-acquisition-15-9aa
  cancel-in-progress: false

jobs:
  acquisition:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI-verified authoritative main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$THREADS_ACCESS_TOKEN"
      - name: Run bounded Threads carrier-feature acquisition
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ALLOW_PHASE15_9AA_THREADS_CARRIER_FEATURE_ACQUISITION: "true"
        run: |
          set -euo pipefail
          node scripts/run-threads-carrier-feature-acquisition-15-9aa.mjs --live --output=phase15-9aa-threads-carrier-feature-acquisition.json 2>&1 | tee phase15-9aa-threads-carrier-feature-acquisition.log
      - name: Upload disposable Phase 15.9AA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-threads-carrier-feature-acquisition-15-9aa
          path: |
            phase15-9aa-threads-carrier-feature-acquisition.json
            phase15-9aa-threads-carrier-feature-acquisition.log
          if-no-files-found: ignore
          retention-days: 1
