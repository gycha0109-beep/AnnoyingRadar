name: Source External Web Full-Context Pilot 15.9F

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-external-web-full-context-pilot-15-9f
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Run bounded external-web full-context pilot
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PHASE15_9F_EXTERNAL_WEB_FULL_CONTEXT: "true"
        run: |
          set -euo pipefail
          node scripts/run-external-web-full-context-pilot-15-9f.mjs --live --output=phase15-9f-external-web-full-context-pilot.json 2>&1 | tee phase15-9f-external-web-full-context-pilot.log
      - name: Upload disposable Phase 15.9F artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-external-web-full-context-pilot-15-9f
          path: |
            phase15-9f-external-web-full-context-pilot.json
            phase15-9f-external-web-full-context-pilot.log
          if-no-files-found: ignore
          retention-days: 1
