name: Source Approved Existing Incident Link 15.9W

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-approved-existing-incident-link-15-9w
  cancel-in-progress: false

jobs:
  link:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI-verified authoritative main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Record and execute exact approved existing Incident reuse
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PHASE15_9W_APPROVED_EXISTING_INCIDENT_LINK: "true"
        run: |
          set -euo pipefail
          node scripts/run-approved-existing-incident-link-15-9w.mjs --live --output=phase15-9w-approved-existing-incident-link.json 2>&1 | tee phase15-9w-approved-existing-incident-link.log
      - name: Upload disposable Phase 15.9W artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-approved-existing-incident-link-15-9w
          path: |
            phase15-9w-approved-existing-incident-link.json
            phase15-9w-approved-existing-incident-link.log
          if-no-files-found: ignore
          retention-days: 1
