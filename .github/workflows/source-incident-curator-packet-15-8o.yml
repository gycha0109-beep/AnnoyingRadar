name: Source Incident Curator Packet 15.8O

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-incident-curator-packet-15-8o
  cancel-in-progress: false

jobs:
  curator-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required Supabase secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Build exact Phase 15.8O curator decision packet
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-incident-mechanism-curator-packet-15-8o.mjs --live --output=phase15-8o-curator-packet.json 2>&1 | tee phase15-8o-curator-packet.log
      - name: Upload disposable Phase 15.8O curator packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-incident-curator-packet-15-8o
          path: |
            phase15-8o-curator-packet.log
            phase15-8o-curator-packet.json
          if-no-files-found: ignore
          retention-days: 1
