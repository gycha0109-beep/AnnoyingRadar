name: Source Carrier Provisioning Admission Triage 15.9AB

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-carrier-provisioning-admission-triage-15-9ab
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CI-verified authoritative main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Run exact carrier-provisioning Admission triage
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PHASE15_9AB_CARRIER_PROVISIONING_ADMISSION_TRIAGE: "true"
        run: |
          set -euo pipefail
          node scripts/run-carrier-provisioning-admission-triage-15-9ab.mjs --live --output=phase15-9ab-carrier-provisioning-admission-triage.json 2>&1 | tee phase15-9ab-carrier-provisioning-admission-triage.log
      - name: Upload disposable Phase 15.9AB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-carrier-provisioning-admission-triage-15-9ab
          path: |
            phase15-9ab-carrier-provisioning-admission-triage.json
            phase15-9ab-carrier-provisioning-admission-triage.log
          if-no-files-found: ignore
          retention-days: 1
