name: Phase 15.5F Live Resolution

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-full-context:
    if: github.head_ref == 'agent/phase15-5f-live-run'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4]
    env:
      PHASE15_5F_FETCH_INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch one public full-context item
        run: node scripts/run-phase15-5f-fetch-one.mjs

  semantic-closeout:
    if: github.head_ref == 'agent/phase15-5f-live-run'
    needs: fetch-full-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact quotes and deterministic mapping
        run: node scripts/run-phase15-5f-manual-semantic-closeout.mjs
