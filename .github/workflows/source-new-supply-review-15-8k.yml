name: Source New-Supply Review 15.8K

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: Deterministic 15.8J new-Review sample size
        required: false
        default: "48"
  push:
    branches:
      - ops/source-new-supply-review-15-8k

permissions:
  contents: read

concurrency:
  group: source-new-supply-review-15-8k
  cancel-in-progress: false

jobs:
  review-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              missing=1
            fi
          }
          require_secret NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          if [ -z "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" ]; then
            echo "Missing required GitHub Actions Supabase service credential" >&2
            missing=1
          fi
          require_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          test "$missing" -eq 0
      - name: Run deterministic 15.8J new-Review full-context sample
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOURCE_FULL_CONTEXT_MODEL: ${{ secrets.OPENAI_SOURCE_FULL_CONTEXT_MODEL || 'gpt-5-mini-2025-08-07' }}
          ALLOW_PAID_SOURCE_FULL_CONTEXT: "true"
          WORKFLOW_SAMPLE_SIZE: ${{ inputs.sample_size || '48' }}
        run: |
          set -euo pipefail
          node scripts/run-new-supply-review-full-context-yield.mjs --live --sample-size="$WORKFLOW_SAMPLE_SIZE" 2>&1 | tee source-new-supply-review-15-8k.log
      - name: Upload aggregate 15.8K diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-new-supply-review-15-8k
          path: source-new-supply-review-15-8k.log
          if-no-files-found: ignore
