name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        run: npm run test 2>&1 | tee test-results.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log
          if-no-files-found: ignore
      - name: Release hardening
        run: npm run test:release 2>&1 | tee release-results.log
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-results
          path: release-results.log
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Runtime smoke
        run: npm run test:runtime 2>&1 | tee runtime-results.log
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-results
          path: runtime-results.log
          if-no-files-found: ignore
