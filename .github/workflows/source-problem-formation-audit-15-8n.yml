name: Source Formation Audit 15.8N

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-formation-audit-15-8n
  cancel-in-progress: false

jobs:
  formation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              missing=1
            fi
          }
          require_secret NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          if [ -z "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}" ]; then
            echo "Missing required GitHub Actions Supabase service credential" >&2
            missing=1
          fi
          require_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          test "$missing" -eq 0
      - name: Audit exact Phase 15.8M-B Candidate cohort for Problem Formation readiness
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOURCE_FORMATION_MODEL: ${{ secrets.OPENAI_SOURCE_FORMATION_MODEL || secrets.OPENAI_SOURCE_FULL_CONTEXT_MODEL || 'gpt-5-mini-2025-08-07' }}
          ALLOW_PAID_SOURCE_FORMATION: "true"
        run: |
          set -euo pipefail
          node scripts/run-source-problem-formation-audit-15-8n.mjs --live --output=phase15-8n-formation-audit.json 2>&1 | tee phase15-8n-formation-audit.log
      - name: Upload disposable Phase 15.8N audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-formation-audit-15-8n
          path: |
            phase15-8n-formation-audit.log
            phase15-8n-formation-audit.json
          if-no-files-found: ignore
          retention-days: 1
