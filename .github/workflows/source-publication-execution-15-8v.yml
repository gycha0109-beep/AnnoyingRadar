name: Source Publication Execution 15.8V

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase15-8v-live-execution

permissions:
  contents: read

concurrency:
  group: source-publication-execution-15-8v
  cancel-in-progress: false

jobs:
  publication-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Publish exact curator-approved Canonical Problem
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PUBLIC_PROBLEM_PUBLICATION: "true"
        run: |
          set -euo pipefail
          node scripts/run-publication-execution-15-8v.mjs --live --output=phase15-8v-publication-execution.json 2>&1 | tee phase15-8v-publication-execution.log
      - name: Upload disposable Phase 15.8V artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-publication-execution-15-8v
          path: |
            phase15-8v-publication-execution.log
            phase15-8v-publication-execution.json
          if-no-files-found: ignore
          retention-days: 1
