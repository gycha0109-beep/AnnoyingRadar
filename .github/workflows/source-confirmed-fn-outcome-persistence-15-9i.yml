name: Source Confirmed False-Negative Outcome Persistence 15.9I

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-confirmed-fn-outcome-persistence-15-9i
  cancel-in-progress: false

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Persist integrity-bound confirmed false-negative outcomes
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PHASE15_9I_CONFIRMED_FN_OUTCOME_PERSISTENCE: "true"
        run: |
          set -euo pipefail
          node scripts/run-confirmed-fn-outcome-persistence-15-9i.mjs --live --output=phase15-9i-confirmed-fn-outcome-persistence.json 2>&1 | tee phase15-9i-confirmed-fn-outcome-persistence.log
      - name: Upload disposable Phase 15.9I artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-confirmed-fn-outcome-persistence-15-9i
          path: |
            phase15-9i-confirmed-fn-outcome-persistence.json
            phase15-9i-confirmed-fn-outcome-persistence.log
          if-no-files-found: ignore
          retention-days: 1
