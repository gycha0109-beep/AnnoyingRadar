name: Source Origin Contract Verification 15.9E

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase15-9e-live-execution

permissions:
  contents: read

concurrency:
  group: source-origin-contract-verification-15-9e
  cancel-in-progress: false

jobs:
  verify-origin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Run bounded source origin contract verification
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PHASE15_9E_SOURCE_ORIGIN_VERIFICATION: "true"
        run: |
          set -euo pipefail
          node scripts/run-source-origin-contract-verification-15-9e.mjs --live --output=phase15-9e-source-origin-contract-verification.json 2>&1 | tee phase15-9e-source-origin-contract-verification.log
      - name: Upload disposable Phase 15.9E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-origin-contract-verification-15-9e
          path: |
            phase15-9e-source-origin-contract-verification.json
            phase15-9e-source-origin-contract-verification.log
          if-no-files-found: ignore
          retention-days: 1
