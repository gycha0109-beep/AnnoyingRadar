name: Source Publication Curator Packet 15.8U

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-publication-curator-packet-15-8u
  cancel-in-progress: false

jobs:
  publication-curator-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Build read-only publication curator packet
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-publication-curator-packet-15-8u.mjs --output=phase15-8u-publication-curator-packet.json 2>&1 | tee phase15-8u-publication-curator-packet.log
      - name: Upload disposable Phase 15.8U artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-publication-curator-packet-15-8u
          path: |
            phase15-8u-publication-curator-packet.log
            phase15-8u-publication-curator-packet.json
          if-no-files-found: ignore
          retention-days: 1
