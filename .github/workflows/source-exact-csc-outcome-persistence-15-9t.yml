name: Source Exact CSC Outcome Persistence 15.9T

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-exact-csc-outcome-persistence-15-9t
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI-verified authoritative main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Persist exact Phase 15.9S candidate outcome
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PHASE15_9T_EXACT_OUTCOME_PERSISTENCE: "true"
        run: |
          set -euo pipefail
          node scripts/run-exact-csc-outcome-persistence-15-9t.mjs --live --output=phase15-9t-exact-csc-outcome-persistence.json 2>&1 | tee phase15-9t-exact-csc-outcome-persistence.log
      - name: Upload disposable Phase 15.9T artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-exact-csc-outcome-persistence-15-9t
          path: |
            phase15-9t-exact-csc-outcome-persistence.json
            phase15-9t-exact-csc-outcome-persistence.log
          if-no-files-found: ignore
          retention-days: 1
