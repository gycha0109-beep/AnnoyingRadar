name: Source Formation Assessment Persistence 15.9N

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-formation-assessment-persistence-15-9n
  cancel-in-progress: false

jobs:
  formation-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$OPENAI_API_KEY"
      - name: Persist one integrity-bound Formation assessment
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOURCE_FORMATION_MODEL: ${{ secrets.OPENAI_SOURCE_FORMATION_MODEL || secrets.OPENAI_SOURCE_FULL_CONTEXT_MODEL || 'gpt-5-mini-2025-08-07' }}
          ALLOW_PHASE15_9N_FORMATION_ASSESSMENT_PERSISTENCE: "true"
        run: |
          set -euo pipefail
          node scripts/run-formation-assessment-persistence-15-9n.mjs --live --output=phase15-9n-formation-assessment-persistence.json 2>&1 | tee phase15-9n-formation-assessment-persistence.log
      - name: Upload disposable Phase 15.9N artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-formation-assessment-persistence-15-9n
          path: |
            phase15-9n-formation-assessment-persistence.log
            phase15-9n-formation-assessment-persistence.json
          if-no-files-found: ignore
          retention-days: 1
