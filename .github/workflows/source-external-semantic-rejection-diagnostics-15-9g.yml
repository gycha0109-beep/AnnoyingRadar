name: Source External Semantic Rejection Diagnostics 15.9G

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase15-9g-live-execution

permissions:
  contents: read

concurrency:
  group: source-external-semantic-rejection-diagnostics-15-9g
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$OPENAI_API_KEY"
      - name: Run bounded external semantic rejection diagnostics
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOURCE_FULL_CONTEXT_MODEL: gpt-5-mini-2025-08-07
          ALLOW_PHASE15_9G_SEMANTIC_REJECTION_DIAGNOSTICS: "true"
        run: |
          set -euo pipefail
          node scripts/run-external-semantic-rejection-diagnostics-15-9g.mjs --live --output=phase15-9g-external-semantic-rejection-diagnostics.json 2>&1 | tee phase15-9g-external-semantic-rejection-diagnostics.log
      - name: Upload disposable Phase 15.9G artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-external-semantic-rejection-diagnostics-15-9g
          path: |
            phase15-9g-external-semantic-rejection-diagnostics.json
            phase15-9g-external-semantic-rejection-diagnostics.log
          if-no-files-found: ignore
          retention-days: 1
