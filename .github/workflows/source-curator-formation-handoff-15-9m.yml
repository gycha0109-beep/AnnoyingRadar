name: Source Curator Formation Handoff 15.9M

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-curator-formation-handoff-15-9m
  cancel-in-progress: false

jobs:
  formation-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$OPENAI_API_KEY"
      - name: Verify curator Formation handoff
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOURCE_FORMATION_MODEL: ${{ secrets.OPENAI_SOURCE_FORMATION_MODEL || secrets.OPENAI_SOURCE_FULL_CONTEXT_MODEL || 'gpt-5-mini-2025-08-07' }}
          ALLOW_PHASE15_9M_CURATOR_FORMATION_HANDOFF: "true"
        run: |
          set -euo pipefail
          node scripts/run-curator-formation-handoff-15-9m.mjs --live --output=phase15-9m-curator-formation-handoff.json 2>&1 | tee phase15-9m-curator-formation-handoff.log
      - name: Upload disposable Phase 15.9M artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-curator-formation-handoff-15-9m
          path: |
            phase15-9m-curator-formation-handoff.log
            phase15-9m-curator-formation-handoff.json
          if-no-files-found: ignore
          retention-days: 1
