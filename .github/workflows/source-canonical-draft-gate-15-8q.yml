name: Source Canonical Draft Gate 15.8Q

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-canonical-draft-gate-15-8q
  cancel-in-progress: false

jobs:
  canonical-draft-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required Supabase secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
      - name: Evaluate approved repeated cluster through Canonical Draft Gate
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-canonical-problem-draft-gate-15-8q.mjs --output=phase15-8q-canonical-problem-draft-gate.json 2>&1 | tee phase15-8q-canonical-problem-draft-gate.log
      - name: Upload Phase 15.8Q aggregate readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-canonical-draft-gate-15-8q
          path: |
            phase15-8q-canonical-problem-draft-gate.log
            phase15-8q-canonical-problem-draft-gate.json
          if-no-files-found: ignore
          retention-days: 1
