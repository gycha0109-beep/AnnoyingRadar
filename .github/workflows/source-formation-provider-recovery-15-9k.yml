name: Source Formation Provider Recovery 15.9K

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase15-9k-live-execution

permissions:
  contents: read

concurrency:
  group: source-formation-provider-recovery-15-9k
  cancel-in-progress: false

jobs:
  provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$OPENAI_API_KEY"
      - name: Reproduce Formation provider-incomplete with bounded recovery
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOURCE_FORMATION_MODEL: ${{ secrets.OPENAI_SOURCE_FORMATION_MODEL || secrets.OPENAI_SOURCE_FULL_CONTEXT_MODEL || 'gpt-5-mini-2025-08-07' }}
          ALLOW_PHASE15_9K_FORMATION_PROVIDER_RECOVERY: "true"
        run: |
          set -euo pipefail
          node scripts/run-formation-provider-recovery-15-9k.mjs --live --output=phase15-9k-formation-provider-recovery.json 2>&1 | tee phase15-9k-formation-provider-recovery.log
      - name: Upload disposable Phase 15.9K recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-formation-provider-recovery-15-9k
          path: |
            phase15-9k-formation-provider-recovery.log
            phase15-9k-formation-provider-recovery.json
          if-no-files-found: ignore
          retention-days: 1
