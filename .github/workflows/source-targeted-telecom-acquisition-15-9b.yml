name: Source Targeted Telecom Acquisition 15.9B

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase15-9b-live-execution

permissions:
  contents: read

concurrency:
  group: source-targeted-telecom-acquisition-15-9b
  cancel-in-progress: false

jobs:
  acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$NAVER_CLIENT_ID"
          test -n "$NAVER_CLIENT_SECRET"
      - name: Run four-query targeted telecom acquisition
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ALLOW_PHASE15_9B_TARGETED_ACQUISITION: "true"
        run: |
          set -euo pipefail
          node scripts/run-targeted-telecom-acquisition-15-9b.mjs --live --output=phase15-9b-targeted-telecom-acquisition.json 2>&1 | tee phase15-9b-targeted-telecom-acquisition.log
      - name: Upload disposable Phase 15.9B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-targeted-telecom-acquisition-15-9b
          path: |
            phase15-9b-targeted-telecom-acquisition.json
            phase15-9b-targeted-telecom-acquisition.log
          if-no-files-found: ignore
          retention-days: 1
